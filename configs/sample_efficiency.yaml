# Success versus number of demonstrations (insertion). Same update budget for
# every dataset size, so small datasets are seen for more epochs.
out: results/sample_efficiency
data: data
tasks: [insertion]
conditions: [state, state+proprio, state+proprio+force, state+proprio+force+aux]
seeds: [0, 1, 2]
n_demos: [25, 50, 100, 200]
collect: {episodes: {insertion: 400, press: 300, surface: 300}, seed: 0, dart_sigma: 0.15}
train: {steps: 2000, batch_size: 128, lr: 3.0e-4}
model: {history: 16, d_model: 64, n_layers: 2}
eval_plan: small
